<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DANTAM DENTAL CARE AND IMPLANT CENTER - Review</title>
<style>
:root{--p:#4f9f0c;--b:#0a2a85;--ink:#1b2a41;--mute:#6f7d93}
*{box-sizing:border-box}
body{margin:0;padding:18px 14px 30px;font-family:"Segoe UI","Helvetica Neue",Roboto,Arial,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;
background:radial-gradient(800px 460px at 0% -5%,#e8ecf4 0%,transparent 60%),radial-gradient(700px 440px at 100% 0%,#e9f6dc 0%,transparent 55%),linear-gradient(180deg,#faf8f5 0%,#f4f2ee 100%)}
.card{position:relative;max-width:640px;margin:0 auto;background:rgba(255,255,255,.94);border:1px solid #fff;border-radius:30px;padding:34px 22px 26px;box-shadow:0 26px 64px rgba(11,58,138,.17),0 2px 0 rgba(255,255,255,.8) inset;text-align:center;overflow:hidden}
.card:before{content:"";position:absolute;left:0;top:0;right:0;height:6px;background:linear-gradient(90deg,var(--p),#2aa7a0 50%,var(--b))}
.logowrap{display:inline-block;padding:12px 14px;margin-top:4px;background:#fff;border:1px solid #e3ecf7;border-radius:20px;box-shadow:0 10px 28px rgba(11,58,138,.12)}
.logo{display:block;width:100%;max-width:320px;height:auto}
h1{margin:18px 0 4px;font-size:16px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--b)}
.sub{color:var(--mute);font-weight:600;font-size:11px;letter-spacing:2.5px}
.sub:after{content:"";display:block;width:70px;height:3px;margin:16px auto 0;border-radius:3px;background:linear-gradient(90deg,var(--p),var(--b))}
h2{font-size:19px;font-weight:700;margin:28px 0 14px;color:var(--ink);letter-spacing:.2px}
.stars{background:linear-gradient(180deg,#fbfcff,#f3f7fc);border:1px solid #e6edf7;border-radius:20px;padding:10px 4px 4px;display:inline-block;box-shadow:inset 0 1px 0 #fff}
.stars button{background:none;border:0;font-size:46px;color:#d6dbe4;cursor:pointer;padding:0 4px;line-height:1.1;transition:transform .15s,color .15s}
.stars button:active{transform:scale(1.22)}
.stars button.on{color:#f5b301;text-shadow:0 4px 12px rgba(245,179,1,.5)}
.mood{min-height:26px;margin-top:10px;font-weight:700;font-size:16px;color:var(--p);letter-spacing:.6px}
.pills{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pill{border:1.5px solid #d8e2f0;background:linear-gradient(180deg,#fff,#f5f8fd);color:var(--b);border-radius:28px;padding:11px 16px;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s;box-shadow:0 2px 6px rgba(11,58,138,.06)}
.pill:active{transform:scale(.96)}
.pill.sel{background:linear-gradient(135deg,var(--p),var(--b));border-color:transparent;color:#fff;box-shadow:0 8px 18px rgba(79,159,12,.28)}
.pill.sel:before{content:"\2713\00a0"}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:18px;color:var(--mute);font-size:14px;font-weight:600}
.pager button{background:linear-gradient(135deg,var(--b),#1b56b8);color:#fff;border:0;border-radius:26px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 6px 14px rgba(11,58,138,.22)}
.pager button:disabled{opacity:.3;box-shadow:none}
.cnt{margin-top:12px;font-size:13px;font-weight:600;color:var(--p);letter-spacing:.4px}
.err{color:#c62828;min-height:20px;font-size:14px;margin:8px 0}
textarea{width:100%;min-height:180px;font-size:16px;line-height:1.55;padding:16px;border:1.5px solid #dbe4f0;border-radius:18px;font-family:inherit;resize:vertical;color:var(--ink);outline:none;background:#fbfdff}
textarea:focus{border-color:var(--p);box-shadow:0 0 0 4px rgba(79,159,12,.1)}
.note{background:linear-gradient(135deg,#f3f8fe,#f3faee);border-left:4px solid var(--p);text-align:left;padding:13px 15px;font-size:14px;line-height:1.5;border-radius:12px;margin:16px 0;color:#43526a}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:18px;font-size:17px;font-weight:700;letter-spacing:.3px;color:#fff;cursor:pointer;margin-top:14px;box-shadow:0 10px 22px rgba(0,0,0,.14);transition:transform .12s}
.btn:active{transform:scale(.98)}
.gen{background:linear-gradient(135deg,var(--p),#2f7305)}
.go{background:linear-gradient(135deg,#31a84c,#1c8236)}.wa{background:linear-gradient(135deg,#25D366,#1aab55)}
.link{display:inline-block;margin-top:18px;font-size:14px;color:var(--b);text-decoration:underline;cursor:pointer}
.igwrap{text-align:center;margin:18px 0 6px}
.ig{display:inline-block;padding:9px 18px;border-radius:24px;font-size:13px;font-weight:700;color:#fff;text-decoration:none;letter-spacing:.3px;background:linear-gradient(45deg,#f09433,#e6683c 30%,#dc2743 55%,#cc2366 75%,#bc1888);box-shadow:0 6px 14px rgba(220,39,67,.25);transition:transform .12s}
.ig:active{transform:scale(.96)}
.hide{display:none}

/* ---- subtle animations ---- */
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes pillin{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:none}}
@keyframes shine{0%{left:-60%}60%,100%{left:130%}}
.card{animation:rise .7s ease both}
.logowrap{animation:floaty 4.5s ease-in-out infinite}
.stars button.on{animation:pop .4s ease}
.pill.in{animation:pillin .4s ease both}
#kwBox:not(.hide),#outBox:not(.hide){animation:rise .5s ease both}
.btn{position:relative;overflow:hidden}
.btn:after{content:"";position:absolute;top:0;left:-60%;width:35%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.32),transparent);transform:skewX(-20deg);animation:shine 3.2s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button{touch-action:manipulation}
html{-webkit-text-size-adjust:100%}
html,body{height:auto;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}
body{min-height:100%}</style></head><body>

const isLow=()=>rating<=3;
const pages=()=>Math.ceil(DATA.kw.length/CONFIG.PAGE_SIZE);
$("biz").textContent=CONFIG.BUSINESS_NAME;$("ig").href=CONFIG.INSTAGRAM_LINK;if(!CONFIG.INSTAGRAM_LINK)$("ig").classList.add("hide");$("sub").textContent=CONFIG.CATEGORY+" \u2022 "+CONFIG.CITY.toUpperCase();

// stars
for(let i=1;i<=5;i++){const b=document.createElement("button");b.textContent="\u2605";b.setAttribute("aria-label",i+" star");b.onclick=()=>setRating(i);$("stars").appendChild(b);}
function setRating(r){
 rating=r;sel=[];page=0;$("txt").value="";$("outBox").classList.add("hide");$("err").textContent="";$("msg").textContent="";
 [...$("stars").children].forEach((b,i)=>b.classList.toggle("on",i<r));
 $("mood").textContent=DATA.moods[r];$("kwHead").textContent=DATA.heads[r];
 $("kwBox").classList.remove("hide");
 $("genBtn").textContent=isLow()?"Generate Feedback":"Generate Review";
 if(isLow()){
  $("note").textContent="Your feedback goes directly to our team on WhatsApp so we can fix the problem and serve you better.";
  $("mainBtn").textContent="Send Feedback on WhatsApp";$("mainBtn").className="btn wa";
  $("gLink").classList.toggle("hide",!CONFIG.SHOW_GOOGLE_LINK_FOR_LOW_RATINGS);
 }else{
  $("note").textContent="Copy & Edit \u2014 Your review will be copied. On Google, select your star rating, paste the review and edit it in your own words.";
  $("mainBtn").textContent="Copy & Open Google Reviews";$("mainBtn").className="btn go";
  $("gLink").classList.add("hide");
 }
 drawPills(true);
}
// keyword pills with pagination
function drawPills(an){
 const box=$("pills");box.innerHTML="";
 DATA.kw.slice(page*CONFIG.PAGE_SIZE,(page+1)*CONFIG.PAGE_SIZE).forEach((k,i)=>{
  const idx=page*CONFIG.PAGE_SIZE+i,b=document.createElement("button");
  b.className="pill"+(sel.includes(idx)?" sel":"")+(an?" in":"");if(an)b.style.animationDelay=(i*35)+"ms";b.textContent=k[0];
  b.onclick=()=>{
   if(sel.includes(idx)){sel=sel.filter(x=>x!==idx);$("err").textContent="";}
   else if(sel.length>=CONFIG.MAX_KEYWORDS){$("err").textContent="You can choose a maximum of "+CONFIG.MAX_KEYWORDS+" keywords.";return;}
   else{sel.push(idx);$("err").textContent="";}
   drawPills(false);
  };
  box.appendChild(b);
 });
 document.querySelector(".pager").style.display=pages()>1?"flex":"none";
 $("cnt").textContent="Selected "+sel.length+" of "+CONFIG.MAX_KEYWORDS;
 $("pg").textContent="Page "+(page+1)+" of "+pages();
 $("prev").disabled=page===0;$("next").disabled=page>=pages()-1;
}
$("prev").onclick=()=>{if(page>0){page--;drawPills(true);}};
$("next").onclick=()=>{if(page<pages()-1){page++;drawPills(true);}};

// pick a sentence not used before in this session (no repeats)
function uniq(make){let s;for(let i=0;i<60;i++){s=make();if(!used.has(s))break;}used.add(s);return s;}
function generate(){
 const tier=rating>=4?"pos":rating===3?"mid":"low",oe=rating===1?2:rating;
 const order=sel.slice().sort(()=>Math.random()-.5),parts=[];
 parts.push(uniq(()=>fill(rnd(DATA.o[oe]))));
 order.forEach(i=>{const k=DATA.kw[i];
  parts.push(uniq(()=>k[1]==="x"?fill(rnd(k[tier==="pos"?2:tier==="mid"?3:4])):cap(rnd(DATA.frames[tier][k[1]]).replace("{k}",rnd(k[2])))));});
 parts.push(uniq(()=>fill(rnd(DATA.e[oe]))));
 $("txt").value=parts.join(" ");$("msg").textContent="";$("outBox").classList.remove("hide");$("outBox").scrollIntoView({behavior:"smooth",block:"nearest"});
}
$("genBtn").onclick=()=>{
 if(!rating||!sel.length){$("err").textContent="Please select a rating and at least 1 keyword.";return;}
 $("err").textContent="";generate();
};

// reliable copy (works on Android, iPhone, HTTP/HTTPS, in-app browsers)
function copyText(text){
 let ok=false;
 try{
  const t=document.createElement("textarea");t.value=text;t.setAttribute("readonly","");
  t.style.cssText="position:fixed;top:0;left:0;opacity:0;font-size:16px";
  document.body.appendChild(t);t.focus();t.select();t.setSelectionRange(0,t.value.length);
  ok=document.execCommand("copy");document.body.removeChild(t);
 }catch(e){}
 try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).catch(()=>{});ok=ok||true;}}catch(e){}
 if(!ok){const a=$("txt");a.focus();a.select();a.setSelectionRange(0,a.value.length);
  $("msg").style.color="#c62828";$("msg").textContent="Copy failed. The text is selected, please tap Copy manually.";}
 else{$("msg").style.color="#2e7d32";$("msg").textContent="Text copied!";}
 return ok;
}
// make sure there is text before acting
function ensureText(){
 if(!$("txt").value.trim()){
  if(!rating||!sel.length){$("err").textContent="Please select a rating and at least 1 keyword.";return false;}
  generate();
 }
 $("err").textContent="";return true;
}
$("mainBtn").onclick=()=>{
 if(!ensureText())return;
 const text=$("txt").value;copyText(text);
 if(isLow()){
  const full="Rating: "+rating+"/5 stars\n\n"+text;
  window.open("https://wa.me/"+CONFIG.WHATSAPP_NUMBER+"?text="+encodeURIComponent(full),"_blank");
 }else window.open(CONFIG.GOOGLE_LINK,"_blank");
};
$("gLink").onclick=()=>{if(!ensureText())return;copyText($("txt").value);window.open(CONFIG.GOOGLE_LINK,"_blank");};
</script></body></html>
